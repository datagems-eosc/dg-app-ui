name: CI - Next.js Quality Gate

on:
  pull_request:
    branches: [main, develop, staging]
  push:
    branches: [main, develop, staging]

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  NODE_ENV: development
  NEXT_TELEMETRY_DISABLED: 1
  CI: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version is sourced from the `packageManager` field in package.json
        # to avoid the "Multiple versions of pnpm specified" error.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          pnpm install --frozen-lockfile
          echo "✅ Dependencies installed"

      - name: Lint with Biome
        run: |
          echo "🔍 Running Biome linter..."
          pnpm run lint:biome:check
          echo "✅ Biome linting passed"

      - name: Type check with TypeScript
        run: |
          echo "📘 Running TypeScript type check..."
          pnpm run type-check
          echo "✅ Type check passed"

      - name: Run tests
        run: |
          echo "🧪 Running tests..."
          pnpm run test:coverage
          echo "✅ Tests passed"

      - name: Security audit
        run: |
          echo "🔒 Running security audit..."
          pnpm audit --audit-level moderate || echo "⚠️ Security audit found issues (non-blocking)"
